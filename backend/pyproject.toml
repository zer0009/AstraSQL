[project]
name = "astrasql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "sqlglot>=25.0.0",
  "faiss-cpu>=1.9.0",
  "numpy>=1.26.0",
  "asyncpg>=0.30.0",
  "cryptography>=43.0.0",
  "sse-starlette>=2.1.0",
  "openpyxl>=3.1.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "argon2-cffi>=25.1.0",
  "huggingface-hub>=2.1.1",
]

[project.optional-dependencies]
# Eval runners (src/eval, scripts/) use the same core deps; install [dev] for pytest.
# Runtime images exclude eval/ via .dockerignore — agent result_compare is under src/agent/.
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-openpyxl>=3.1.0",
]
eval = []  # marker only; eval code ships with the package, no extra deps yet

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "postgres: integration tests that need a live Postgres (set ASTRASQL_PG_DSN)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "F401",
  "F811",
  "I",
  "B",
  "UP",
]
ignore = [
  # FastAPI dependency defaults are intentional; B008 also flags File()/Form().
  "B008",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
follow_imports = "silent"
packages = ["src.providers", "src.config", "src.api", "src.storage"]
