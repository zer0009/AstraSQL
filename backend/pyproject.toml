[project]
name = "astrasql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "sqlglot>=25.0.0",
  "faiss-cpu>=1.9.0",
  "numpy>=1.26.0",
  "asyncpg>=0.30.0",
  "cryptography>=43.0.0",
  "sse-starlette>=2.1.0",
  "openpyxl>=3.1.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

# Keep CI focused on correctness; broader style cleanup can come later.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
